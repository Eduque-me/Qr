<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planche QR codes 3 x 5 cm</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
.toolbar { padding: 16px; text-align: center; }
.toolbar button { padding: 10px 18px; font-weight: bold; cursor: pointer; }
.sheet {
  width: 210mm; min-height: 297mm; margin: 0 auto; padding: 33mm 18mm;
  display: grid; grid-template-columns: repeat(4, 30mm); grid-template-rows: repeat(3, 50mm);
  gap: 15mm 12mm; justify-content: center;
}
.sticker {
  width: 30mm; height: 50mm; border: 0.2mm dashed #999;
  display: flex; align-items: center; justify-content: center;
  page-break-inside: avoid;
}
.sticker img { width: 24mm; height: 24mm; display: block; }
@media print {
  .toolbar { display: none; }
  .sheet { width: 210mm; height: 297mm; min-height: 297mm; }
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">Imprimer la planche</button>
</div>
<div class="sheet">
<div class="sticker"><img src="stickers_3x5cm/pot_1_presidente_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_2_encadreur_ped_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_3_examinateur_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_4_encadreur_pro_ANDRIANAIVO_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_5_encadreur_pro_RALAMBOSOA_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_6_encadreur_pro_RANDRIAMANANTENA_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_1_presidente_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_2_encadreur_ped_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_3_examinateur_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_4_encadreur_pro_ANDRIANAIVO_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_5_encadreur_pro_RALAMBOSOA_3x5cm.png" alt="QR code destinataire"></div>
<div class="sticker"><img src="stickers_3x5cm/pot_6_encadreur_pro_RANDRIAMANANTENA_3x5cm.png" alt="QR code destinataire"></div>

</div>
</body>
</html>
