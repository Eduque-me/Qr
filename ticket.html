<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Codes Soutenance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 20px;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 500px;
    width: 100%;
  }

  .qr-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .qr-item canvas {
    display: block;
  }

  .qr-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #333;
    text-align: center;
  }

  .scan-me {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #888;
    text-transform: uppercase;
    text-align: center;
  }

  /* Bouton imprimer — invisible sauf survol */
  .print-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #1b2d21;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.15;
    transition: opacity 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .print-btn:hover { opacity: 1; }

  @media print {
    .print-btn { display: none; }
    body { padding: 0; }
    .grid { max-width: 100%; }
  }
</style>
</head>
<body>

<h1>📷 Scannez votre QR Code</h1>

<div class="grid" id="grid"></div>

<!-- Bouton imprimer très discret (visible seulement au survol) -->
<button class="print-btn" onclick="window.print()" title="Imprimer">🖨</button>

<script>
// Déterminer l'URL de base (GitHub Pages ou localhost)
const BASE = (() => {
  const l = window.location;
  // Retirer ticket.html du chemin
  const path = l.pathname.replace(/\/ticket\.html$/, '/index.html');
  if (!path.endsWith('index.html')) {
    return l.origin + path.replace(/\/$/, '') + '/index.html';
  }
  return l.origin + path;
})();

const profs = [
  { id: 0, label: "Présidente du Jury",    abbr: "Mme RANDRIAMANANTANY" },
  { id: 1, label: "Encadreur Pédagogique", abbr: "M. RAKOTOARIMANANA" },
  { id: 2, label: "Examinateur",           abbr: "M. CLERK" },
  { id: 3, label: "Encadreur Pro.",        abbr: "M. ANDRIANAIVO" }
];

const grid = document.getElementById('grid');

profs.forEach(p => {
  const url = BASE + '?prof=' + p.id;

  const item = document.createElement('div');
  item.className = 'qr-item';

  const qrDiv = document.createElement('div');
  qrDiv.id = 'qr' + p.id;

  const label = document.createElement('div');
  label.className = 'qr-label';
  label.textContent = p.abbr;

  const scan = document.createElement('div');
  scan.className = 'scan-me';
  scan.textContent = '[ SCAN ME ]';

  item.appendChild(qrDiv);
  item.appendChild(label);
  item.appendChild(scan);
  grid.appendChild(item);

  new QRCode(qrDiv, {
    text: url,
    width: 160,
    height: 160,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: 1  // L - petite correction d'erreur, URL plus courte
  });
});
</script>
